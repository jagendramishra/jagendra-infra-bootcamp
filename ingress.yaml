apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elasticsearch-grafana-ingress
  namespace: ingress-nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
          - path: /elasticsearch
            pathType: Prefix
            backend:
              service:
                name: elasticsearch-master
                port:
                  number: 9200
