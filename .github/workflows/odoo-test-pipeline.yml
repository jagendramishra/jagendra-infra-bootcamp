name: SSH RSYNC TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH manually
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          eval "$(ssh-agent -s)"

          ssh-add ~/.ssh/id_rsa

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

          echo "SSH setup completed"

      - name: Debug SSH
        shell: bash
        run: |
          set -x

          echo "=== SSH ENV ==="
          env | grep SSH || true

          echo "=== SSH AGENT KEYS ==="
          ssh-add -l || true

          echo "=== TEST GITHUB SSH ==="
          ssh -T git@github.com || true

      - name: Test RSYNC locally
        shell: bash
        run: |
          set -x

          mkdir -p testdir

          echo "hello world" > testdir/test.txt

          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./testdir/ \
            ./testdir-copy/

          echo "=== RSYNC COMPLETED ==="

          ls -la ./testdir-copy/
