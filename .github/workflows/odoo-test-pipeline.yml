name: Odoo Test Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_drc_only:
        description: "Run only DRC step"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true        

permissions:
  contents: read

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH manually
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          eval "$(ssh-agent -s)"

          ssh-add ~/.ssh/id_rsa

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          echo "SSH setup completed"

      - name: Print workflow info
        run: |
          echo "Workflow started"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deploy DRC Only: ${{ github.event.inputs.deploy_drc_only }}"

  deploy_stg:
    name: Deploy STG
    runs-on: ubuntu-latest

    needs:
      - prepare

    if: fromJSON(github.event.inputs.deploy_drc_only || 'false') != true

    steps:
      - name: STG
        run: |
          echo "Running STG deployment"

  deploy_uat:
    name: Deploy UAT
    runs-on: ubuntu-latest

    needs:
      - deploy_stg

    if: fromJSON(github.event.inputs.deploy_drc_only || 'false') != true

    steps:
      - name: UAT
        run: |
          echo "Running UAT deployment"

  deploy_prd:
    name: Deploy PRD
    runs-on: ubuntu-latest

    needs:
      - deploy_uat

    if: fromJSON(github.event.inputs.deploy_drc_only || 'false') != true

    steps:
      - name: PRD
        run: |
          echo "Running PRD deployment"

  deploy_drc:
    name: Deploy DRC
    runs-on: ubuntu-latest

    needs:
      - prepare

    if: fromJSON(github.event.inputs.deploy_drc_only || 'false') == true

    steps:
      - name: DRC
        run: |
          echo "Running DRC deployment only"
